
services:
  app:
    image: nirajdhore/sample-app:v1.2
    container_name: compose-app
    ports:
      - "8084:80"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: compose-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sampledb
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    mem_limit: 400m
    cpus: 0.5
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  db_data:

