
services:
  task-manager:
    build: .
    container_name: task-manager
    ports:
      - "5000:5000"
    environment:
      DB_PATH: /data/tasks.db
      FRONTEND_PATH: /app/frontend
    volumes:
      - task-manager-data:/data
    restart: unless-stopped

volumes:
  task-manager-data:
    name: task-manager-data

