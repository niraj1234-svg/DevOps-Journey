<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Task Manager</h1>
            <p>Manage your daily tasks efficiently.</p>
        </header>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                required
            >
            <button type="submit">Add Task</button>
        </form>

        <div class="task-summary">
            <span>Total Tasks: <strong id="total-count">0</strong></span>
            <span>Completed: <strong id="completed-count">0</strong></span>
        </div>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
